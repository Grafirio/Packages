name: Infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Grafirio.Shared.Infrastructure.Tests -c Release -p:RestoreSources=https://api.nuget.org/v3/index.json
